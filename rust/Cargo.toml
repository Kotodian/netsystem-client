[workspace]
resolver = "3"
members = [
    "crates/hammer-shmem",
    "crates/hammer-binary-api-protocol",
    "crates/hammer-binary-api-client",
    "crates/hammer-binary-api-rpc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
cc = "1.2"
libc = "0.2"
posix-sync = "0.1.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
